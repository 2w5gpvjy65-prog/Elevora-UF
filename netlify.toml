# Ren statisk sida, inget byggsteg behövs.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Skicka www.elevorauf.se vidare till elevorauf.se
[[redirects]]
  from = "https://www.elevorauf.se/*"
  to = "https://elevorauf.se/:splat"
  status = 301
  force = true
