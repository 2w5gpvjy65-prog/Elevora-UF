# Hämtar fria bilder från Pexels och sparar dem i img/foton/.
# Listan finns i img/foton/lista.txt: "filnamn pexels-id" per rad.
name: Hämta bilder
on:
  workflow_dispatch:
  push:
    paths:
      - img/foton/lista.txt
permissions:
  contents: write
jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ladda ner
        run: |
          cd img/foton
          while read -r name id; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            if [ -f "$name.jpg" ]; then echo "finns redan: $name"; continue; fi
            echo "hämtar $name ($id)"
            curl -sSL --fail -A "Mozilla/5.0" -o "$name.jpg" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1400" || { echo "MISSLYCKADES: $name"; rm -f "$name.jpg"; }
            if [ -f "$name.jpg" ]; then file "$name.jpg"; fi
          done < lista.txt
      - name: Spara
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/foton
          git diff --cached --quiet || git commit -m "Hämta bilder från Pexels"
          git push
