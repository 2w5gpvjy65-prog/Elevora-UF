name: Safari-test
on:
  push:
    paths:
      - test/safari.mjs
      - .github/workflows/safari-test.yml
jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.56.1 && npx playwright install --with-deps webkit
      - run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2 && node test/safari.mjs
